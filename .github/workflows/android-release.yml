name: Build And Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Release workflow must run from a version tag."
            exit 1
          fi
          git fetch origin main --prune
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag commit must belong to origin/main history."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -E '^[[:space:]]*versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' | tr -d ' ')
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Version mismatch: tag $TAG_VERSION does not match app/build.gradle.kts versionName $GRADLE_VERSION."
            exit 1
          fi

      - name: Allocate stable build version
        id: version
        run: python3 scripts/ci_release.py prepare --channel stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          test -n "$KEY_JKS" || { echo "KEY_JKS secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "STORE_PASSWORD secret is missing"; exit 1; }

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-key.jks
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          printf '%s' "$KEY_JKS" | base64 --decode > "$KEYSTORE_FILE"
          ./gradlew :app:assembleRelease \
            -PciVersionCode=${{ steps.version.outputs.versionCode }} \
            -PciVersionName=${{ steps.version.outputs.versionName }} \
            -PciUpdateChannel=stable
          python3 scripts/ci_release.py package --apk app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "${{ runner.temp }}/release-key.jks"

      - name: Publish signed release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py publish
