{id:1,source:'少数派',date:'今天 09:42',title:'把收藏变成知识：建立一个真正用得起来的个人信息系统',excerpt:'不再忙着收集更多信息，而是让已经留下的内容，真正参与到你的思考和行动中。',favorite:true,comment:'下次整理收藏时，先从一个正在做的项目开始，而不是从标签开始。',summary:'## 让信息回到使用场景\n\n收藏一篇文章很容易，真正困难的是：在需要的时候找得到，并把它变成自己的理解。一个好的知识系统，不应只是更精致的仓库。\n\n与其一开始就设计复杂的分类，不如先问自己：这条信息会帮助我完成什么？\n\n## 三个值得保留的习惯\n\n- 带着问题阅读。先明确当前正在思考的事情，再决定哪些内容值得留下。\n- 用自己的话写一句备注。记录它为什么重要，而不只是保存原文。\n- 给收藏一个出口。把想法用于写作、项目，或者一次真实的讨论。\n\n> 知识的价值，不在于你保存了多少，而在于它改变了什么。\n\n## 从一次小整理开始\n\n挑选最近收藏的五篇文章，删掉已经不再需要的内容，为剩下的每一篇补上一句备注。这比重新规划整套目录，更容易让系统运转起来。',body:'## 从收集者到使用者\n\n我们每天都在保存链接、截图和笔记。工具让收藏越来越方便，但也让我们误以为保存等于理解。\n\n真正有效的整理，是在信息与正在做的事情之间建立联系。阅读时，试着给每篇文章留下一个具体的问题；回顾时，看看它是否已经帮助你做出了不同的决定。\n\n## 少一点结构，多一点连接\n\n不必把每一条信息都放进完美的文件夹。给它写一句自己的理解，把它关联到一个项目，然后在实践中继续补充。\n\n这篇示例文章用于检查长内容阅读、标题换行与滚动体验。\n\n## 让回顾成为下一次行动\n\n每周选一个固定时间，只回顾与你当前目标相关的内容。将值得继续思考的部分变成一段写作、一项任务，或一次与朋友的对话。\n\n收藏不是终点，使用才是。'},

let page='articles',selected=1,tab='summary',filter='all',query='',editing=false,draft={},dirty=false,preview=true,scenario='normal',dark=false,toastTimer;
const $=id=>document.getElementById(id);
const pageMeta={articles:{name:'文章',icon:'article',search:'搜索标题、内容或备注'},diary:{name:'日记',icon:'diary',search:'搜索日记、标签或心情'},books:{name:'书籍',icon:'books',search:'搜索书名、作者或分类'}};
function data(){return page==='articles'?articles:page==='diary'?diaries:books;}
function current(){return data().find(x=>x.id===selected);}
function markdown(text){return esc(text).split('\n\n').map(block=>{if(block.startsWith('## '))return '<h2>'+block.slice(3)+'</h2>';if(block.startsWith('&gt; '))return '<blockquote>'+block.slice(5)+'</blockquote>';if(block.startsWith('- '))return '<ul>'+block.split('\n').map(s=>'<li>'+s.replace(/^- /,'')+'</li>').join('')+'</ul>';return '<p>'+block.replace(/\n/g,'<br>')+'</p>';}).join('').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function leave(){return !dirty||window.confirm('尚有未保存的示例修改。离开会丢弃这些修改，确定继续吗？');}
function updateChrome(){
$('navigation').innerHTML='<div class="nav-section-label">我的空间</div>'+[['today','今日','today'],['articles','文章','article'],['diary','日记','diary'],['books','书籍','books'],['ai','AI 助手','ai'],['tasks','任务中心','tasks']].map(([key,label,i])=>'<button class="nav-item '+(page===key?'active':'')+'" data-page="'+key+'" '+(!pageMeta[key]?'disabled title="本轮设计稿展示文章、日记和书籍"':'title="'+label+'"')+' '+(page===key?'aria-current="page"':'')+'>'+icon(i)+'<span>'+label+'</span></button>').join('');
$('collection-title').textContent=pageMeta[page].name;$('search').placeholder=pageMeta[page].search;$('search').value=query;$('search-icon').innerHTML=icon('search');$('new-button').innerHTML=icon('plus');$('new-button').setAttribute('aria-label','新建'+pageMeta[page].name);
$('filters').innerHTML=(page==='articles'?[['all','全部文章'],['favorite','已收藏']]:page==='diary'?[['all','全部日记'],['week','本周']]:[['all','全部书籍'],['noted','有感悟']]).map(([value,label])=>'<button class="filter '+(filter===value?'active':'')+'" data-filter="'+value+'" aria-pressed="'+(filter===value)+'">'+label+'</button>').join('');
$('list-caption').textContent=page==='articles'?'最近保存':page==='diary'?'2026 年 10 月':'我的阅读';
$('device').classList.toggle('offline',scenario==='offline');$('device').innerHTML=icon('phone')+'<div><strong>我的手机 <span class="muted">· 示例</span></strong><small><i class="dot"></i>'+(scenario==='offline'?'连接已断开':'同一 Wi-Fi · 已连接')+'</small></div>';
$('theme-button').innerHTML=icon(dark?'sun':'moon');$('theme-button').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');
}
function empty(iconName,title,message,action,label){return '<div class="empty-state">'+icon(iconName)+'<h2>'+esc(title)+'</h2><p>'+esc(message)+'</p>'+(action?'<button class="button" data-action="'+action+'">'+label+'</button>':'')+'</div>';}
function list(){
let items=data().filter(x=>(filter!=='favorite'||x.favorite)&&(filter!=='week'||x.id!==14)&&(filter!=='noted'||x.notes.length)&&(!query||[x.title,x.excerpt,x.comment,x.content,x.tags,x.mood,x.author,x.category].join(' ').toLowerCase().includes(query.toLowerCase())));
$('list-count').textContent='共 '+items.length+' '+(page==='books'?'本书':'篇');
if(scenario==='loading'){$('items').innerHTML=Array.from({length:4},()=>'<div class="skeleton-group" aria-label="加载中"><div class="skeleton short"></div><div class="skeleton title"></div><div class="skeleton"></div><div class="skeleton short"></div></div>').join('');return;}
if(scenario==='error'){$('items').innerHTML=empty('alert','暂时无法读取内容','请检查手机上的 Web 服务是否开启。','retry','重新加载');return;}
if(scenario==='empty'){$('items').innerHTML=empty(pageMeta[page].icon,'从第一条记录开始','你留下的内容，会出现在这里。','new','新建'+pageMeta[page].name);return;}
if(!items.length){$('items').innerHTML=empty('search','没有找到匹配内容','试试其他关键词，或清除筛选。','reset-search','清除搜索和筛选');return;}

}
function toolbar(item){return '<header class="detail-toolbar"><div class="breadcrumb"><button class="icon-button back-button" data-action="back" aria-label="返回列表">'+icon('arrow')+'</button>'+icon(pageMeta[page].icon)+'<span>'+pageMeta[page].name+'</span><span class="desktop-only">/</span><span class="desktop-only">'+(editing?'编辑内容':'阅读空间')+'</span></div><div class="toolbar-actions">'+(editing?'<button class="button" data-action="cancel">取消</button><button class="button primary" data-action="save">'+icon('check')+'<span>保存<span class="desktop-only">修改</span></span></button>':(page==='articles'?'<button class="icon-button" data-action="favorite" aria-label="'+(item.favorite?'取消收藏':'收藏文章')+'" style="color:'+(item.favorite?'var(--primary)':'var(--muted)')+'">'+icon('star')+'</button>':'')+'<button class="button" data-action="edit" aria-label="编辑'+(page==='articles'?'资料':page==='diary'?'日记':'书籍')+'">'+icon('edit')+'编辑<span class="desktop-only">'+(page==='articles'?'资料':page==='diary'?'日记':'书籍')+'</span></button>')+'</div></header>';}
function status(){return '<footer class="reader-status"><span class="status-left" id="save-status">'+icon(editing?'edit':'check')+(editing?'示例编辑 · 尚未保存':'示例内容 · 不连接真实手机')+'</span><span class="desktop-only" id="word-count">'+(editing?'Ctrl / ⌘ + S 保存':'支持键盘搜索 /')+'</span></footer>';}
function notices(){return scenario==='offline'?'<div class="notice error">手机已离线。已打开的内容仍可阅读，编辑内容会保留在当前页面。<button class="button" data-action="retry">重新连接</button></div>':scenario==='conflict'?'<div class="notice">手机上的内容已有更新。先复制当前修改，再读取最新内容，避免覆盖。<button class="button" data-action="copy">复制当前内容</button></div>':'';}
function detail(){
const item=current();
if(scenario==='loading'){$('detail').innerHTML='<div class="reader"><div class="skeleton short"></div><div class="skeleton title"></div>'+Array.from({length:8},()=>'<div class="skeleton"></div>').join('')+'</div>';return;}
if(scenario==='empty'||scenario==='error'||!item){$('detail').innerHTML=empty(pageMeta[page].icon,scenario==='error'?'连接恢复后，继续你的阅读':'给想法一个安静的地方',scenario==='error'?'你的记录仍在手机上，稍后可以重新加载。':'从左侧选择内容，或新建一条记录。');return;}
if(editing){$('detail').innerHTML=toolbar(item)+notices()+editor()+status();updateDraftStatus();return;}
let content='';
if(page==='articles'){
content='<div class="reader-scroll"><article class="reader"><div class="reader-source"><span class="source-icon">'+esc(item.source.slice(0,1))+'</span><span>'+esc(item.source)+'</span><span>· 网页收藏</span></div><h1>'+esc(item.title)+'</h1><div class="reader-meta"><span>'+esc(item.date)+' 保存</span><span>·</span><span>约 4 分钟阅读</span>'+(item.favorite?'<span>· 已收藏</span>':'')+'</div><div class="mode-tabs" role="tablist" aria-label="文章内容模式">'+[['summary','摘要'],['body','正文'],['original','原文'],['comment','我的备注']].map(([value,label])=>'<button role="tab" aria-selected="'+(tab===value)+'" class="'+(tab===value?'active':'')+'" data-tab="'+value+'">'+label+'</button>').join('')+'</div><div class="prose" role="tabpanel">'+(tab==='comment'?markdown(item.comment||'还没有备注。点击右上角「编辑资料」，记下它对你的启发。'):tab==='original'?'<p class="muted">原始网页内容 · 此处为离线阅读示例，不会请求外部网站。</p>'+markdown(item.body||item.summary):markdown(tab==='body'?(item.body||item.summary):item.summary))+'</div><div class="article-end">'+icon('edit')+'<span>留下你的理解，比多收藏一篇更重要。</span><button data-action="edit">写备注</button></div></article></div>';
}else if(page==='diary'){
content='<div class="reader-scroll"><article class="reader"><div class="reader-source">个人日记</div><h1>'+esc(item.date)+'</h1><div class="reader-meta"><span>'+esc(item.mood)+'</span>'+item.tags.split(/[,，]/).filter(Boolean).map(t=>'<span># '+esc(t.trim())+'</span>').join('')+'</div><div class="prose" style="margin-top:var(--xl)">'+markdown(item.content)+'</div><div class="article-end">'+icon('diary')+'<span>为平凡的一天，留下一点回声。</span></div></article></div>';
}else{
content='<div class="reader-scroll"><article class="book-layout"><div class="book-hero"><div class="book-cover"><strong>'+esc(item.title)+'</strong><span>'+esc(item.author)+'</span></div><div><div class="eyebrow">我的书架</div><h1>'+esc(item.title)+'</h1><p>'+esc(item.author)+' · '+esc(item.category)+'</p><button class="button" data-action="viewpoint">'+icon('plus')+'记下感悟</button></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--l)"><h2 style="font-size:var(--reading)">读书感悟</h2><span class="muted"><small>'+item.notes.length+' 条记录</small></span></div>'+(item.notes.length?item.notes.map((n,i)=>'<section class="viewpoint"><h2>'+esc(n.title)+'</h2><p>'+esc(n.content)+'</p>'+(n.example?'<div class="prose"><blockquote>'+esc(n.example)+'</blockquote></div>':'')+'<footer><span>10 月 28 日</span><button data-note="'+i+'">编辑感悟</button></footer></section>').join(''):empty('books','好想法值得留下来','记录一个观点，以及它与你的生活有什么联系。','viewpoint','写第一条感悟'))+'</article></div>';
}

function render(){updateChrome();list();detail();}
function edit(kind,noteIndex){
const item=current();editing=true;dirty=false;
if(kind==='viewpoint'){draft={kind:'viewpoint',title:'',content:'',example:'',noteIndex,...(item.notes[noteIndex]||{})};}
else if(page==='articles')draft={kind:'article',title:item.title,comment:item.comment};
else if(page==='diary')draft={kind:'diary',content:item.content,mood:item.mood,tags:item.tags};
else draft={kind:'book',title:item.title,author:item.author,category:item.category};
detail();$('workspace').classList.add('detail-open');
}
function updateDraftStatus(){if(!editing)return;const status=$('save-status');if(status)status.innerHTML=icon('edit')+(dirty?'修改仅在当前页面 · 待保存':'示例编辑 · 尚未修改');const count=$('word-count');if(count&&draft.kind==='diary')count.textContent=draft.content.length+' 字 · Ctrl / ⌘ + S 保存';}
function save(){
if(!editing)return;
if(scenario==='offline'){toast('手机离线，未保存。当前修改仍保留在编辑器中。');return;}
if(scenario==='conflict'){toast('存在修改冲突，未覆盖手机内容。可先复制当前修改。');return;}
if((draft.kind==='diary'&&!draft.content.trim())||(['article','book','viewpoint'].includes(draft.kind)&&!draft.title.trim())||(draft.kind==='viewpoint'&&!draft.content.trim())){toast('请先填写'+(draft.kind==='diary'?'日记内容':draft.kind==='viewpoint'?'标题和感悟内容':'标题')+'。');return;}
const item=current();
if(draft.kind==='newArticle'){
try{const url=new URL(draft.url);if(!['http:','https:'].includes(url.protocol))throw Error();articles.unshift({id:Date.now(),source:url.hostname,date:'刚刚',title:'新收藏的示例文章',excerpt:'正式功能会将链接交给手机解析。',summary:'## 已添加示例链接\n\n'+draft.url,comment:'',favorite:false});selected=articles[0].id;}catch{toast('请输入有效的 http 或 https 链接。');return;}
}else if(draft.kind==='viewpoint'){
const note={title:draft.title,content:draft.content,example:draft.example};if(draft.noteIndex===undefined)item.notes.unshift(note);else item.notes[draft.noteIndex]=note;
}else if(draft.kind==='diary'){Object.assign(item,{content:draft.content,mood:draft.mood,tags:draft.tags,title:draft.content.replace(/^#+\s*/,'').split('\n')[0],excerpt:draft.content.replace(/#+\s*/g,'').replace(/\n/g,' ').slice(0,100)});}
else if(draft.kind==='article')Object.assign(item,{title:draft.title,comment:draft.comment});
else Object.assign(item,{title:draft.title,author:draft.author,category:draft.category,source:draft.author});
editing=false;dirty=false;render();toast('已保存到设计稿示例，未写入手机。');
}
function create(){
if(!leave())return;
if(scenario!=='offline'){scenario='normal';$('scenario').value='normal';}query='';filter='all';
if(page==='articles'){selected=articles[0].id;editing=true;dirty=false;draft={kind:'newArticle',url:''};}
else if(page==='diary'){const item={id:Date.now(),source:'今天',date:'10 月 30 日 · 星期五',title:'新日记',excerpt:'未填写正文',mood:'平静',tags:'',content:''};diaries.unshift(item);selected=item.id;edit();}
else{const item={id:Date.now(),source:'未填写作者',date:'刚刚',title:'新书籍',excerpt:'',author:'',category:'',notes:[]};books.unshift(item);selected=item.id;edit();draft.title='';}
render();$('workspace').classList.add('detail-open');
}
document.addEventListener('click',async event=>{
const target=event.target.closest('button');if(!target||target.disabled)return;
if(target.dataset.page){if(!leave())return;page=target.dataset.page;query='';filter='all';selected=data()[0]?.id;editing=false;dirty=false;tab='summary';$('workspace').classList.remove('detail-open');render();return;}
if(target.dataset.id){if(!leave())return;selected=Number(target.dataset.id);editing=false;dirty=false;tab='summary';list();detail();$('workspace').classList.add('detail-open');return;}
if(target.dataset.filter){filter=target.dataset.filter;updateChrome();list();return;}
if(target.dataset.tab){tab=target.dataset.tab;detail();return;}
if(target.dataset.note!==undefined){edit('viewpoint',Number(target.dataset.note));return;}
if(target.dataset.format){const area=$('writing');if(!area){toast('请先关闭窄屏预览，再编辑正文。');return;}const start=area.selectionStart,end=area.selectionEnd,selectedText=area.value.slice(start,end);const insert={heading:'\n## '+(selectedText||'小标题')+'\n',bold:'**'+(selectedText||'重点')+'**',list:'\n- '+(selectedText||'列表内容'),quote:'\n> '+(selectedText||'值得记下的话'),link:'['+(selectedText||'链接文字')+'](https://example.com)'}[target.dataset.format];area.setRangeText(insert,start,end,'end');area.dispatchEvent(new Event('input',{bubbles:true}));area.focus();return;}
switch(target.dataset.action){
case'theme':dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';updateChrome();break;
case'favorite':current().favorite=!current().favorite;list();detail();break;
case'edit':edit();break;
case'viewpoint':edit('viewpoint');break;
case'save':save();break;
case'cancel':if(leave()){editing=false;dirty=false;render();}break;
case'new':create();break;
case'back':$('workspace').classList.remove('detail-open');break;
case'preview':preview=!preview;detail();break;
case'retry':scenario='normal';$('scenario').value='normal';render();toast('已恢复正常示例场景。');break;
case'reset-search':query='';filter='all';updateChrome();list();break;
case'copy':try{await navigator.clipboard.writeText(editing?(draft.content||draft.comment||draft.title):current().content||current().summary||current().title);toast('已复制当前内容。');}catch{toast('浏览器未允许复制，请手动选择编辑器中的文字复制。');}break;
}
});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;list();return;}const key=event.target.dataset.field;if(!key)return;draft[key]=event.target.value;dirty=true;updateDraftStatus();if(key==='content'&&$('live-preview'))$('live-preview').innerHTML=markdown(draft.content);});
document.addEventListener('change',event=>{if(editing&&event.target.isConnected&&event.target.tagName==='SELECT'&&event.target.dataset.field){draft[event.target.dataset.field]=event.target.value;dirty=true;updateDraftStatus();}if(event.target.id==='scenario'){scenario=event.target.value;render();}});
document.addEventListener('submit',event=>{if(event.target.id==='edit-form'){event.preventDefault();save();}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'&&editing){event.preventDefault();save();}if(event.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){event.preventDefault();$('search').focus();}if(event.key==='Escape'&&!editing)$('workspace').classList.remove('detail-open');});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
const params=new URLSearchParams(location.search);if(params.get('theme')==='dark'){dark=true;document.documentElement.dataset.theme='dark';}if(pageMeta[params.get('page')]){page=params.get('page');selected=data()[0].id;}if(params.get('edit')==='1'){render();edit();}else render();
</script>
</body>
</html>
