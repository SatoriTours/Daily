<body>
<h1>首页只看五个重点，展开再读详情</h1>
<p class="intro">Daily Satori · 界面提案　／　左侧精简首页，中间保留热榜，右侧展开汇总。所有标题、排名、热度与汇总均为示例。</p>
<div class="board">
<section class="column"><p class="caption">01 精选首页<span>五条重点，直接往下读新闻</span></p><div class="phone" data-initial="feed"></div><p class="footnote">去掉分区标题、去重提示和筛选按钮。<br>汇总只保留五条重点，下一张就是新闻卡片。</p></section>
<section class="column"><p class="caption">02 热榜<span>平台排名 + 精选收录状态</span></p><div class="phone" data-initial="hot"></div><p class="footnote">榜单保持平台顺序，标注“已收录精选”。<br>点击已收录的条目，进入与精选相同的详情。</p></section>
<section class="column"><p class="caption">03 汇总详情<span>点击重点，展开对应内容</span></p><div class="phone" data-initial="summary"></div><p class="footnote">首页不显示导语、长段落和引用标签。<br>完整解读与参考文章集中到详情中。</p></section>
</div>
<script>
const icons={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M19 8a8 8 0 0 0-14-2M5 16a8 8 0 0 0 14 2"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>',share:'<path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[n]+'</svg>';
const status='<div class="status"><span>09:41</span><span>5G ▰▰ ▰</span></div>';
const footer='<div class="demo-label">设计预览 · 示例数据 · 尚未接入真实服务</div><div class="home"></div><div class="toast" role="status"></div><div class="modal" role="dialog" aria-modal="true" aria-label="内容说明"><div class="sheet"></div></div>';
const articles=[
 {kind:'开源项目',title:'把文档变成 Markdown，让知识整理更简单',text:'MarkItDown 将文档转换为更易整理的文本，适合个人知识库和资料处理流程。',tags:['GitHub 日榜 #3','HN 热榜 #8'],meta:'GitHub · Hacker News · 4 分钟',type:'hot'},
 {kind:'产品与生活',title:'离线优先应用：让个人资料随时可用',text:'从阅读、笔记到资料归档，梳理离线优先工具的使用价值。',tags:[],meta:'新闻订阅 · 6 分钟',type:'news'},
 {kind:'开发者讨论',title:'如何让自己的阅读工具更轻量？',text:'HN 社区围绕订阅、归档和搜索分享不同的实现思路。',tags:['HN 热榜 #12'],meta:'Hacker News · 3 分钟',type:'hot'}
];
function article(a,i){return '<button class="article" data-article="'+i+'"><div class="article-category">'+a.kind+'</div><h4>'+a.title+'</h4><p>'+a.text+'</p><div class="badges">'+a.tags.map(t=>'<span class="badge">'+t+'</span>').join('')+'</div><div class="article-meta"><span>'+a.meta+'</span>'+icon('bookmark')+'</div></button>'}
const summaryPoints=[
 {title:'文档转换工具受到开源社区关注',body:'将零散文档转换为统一的文本格式，可以降低资料整理与检索的成本。今天关注的项目适合用作个人知识库的资料入口，具体效果仍需结合自己的文档格式判断。',source:'GitHub 日榜 #3 · HN 热榜 #8',article:0},
 {title:'离线优先应用让个人资料更自主',body:'阅读记录、笔记和归档资料如果能在本地保存，并提供通用格式导出，就更方便离线使用与长期迁移。选择工具时，可以关注数据存储位置和导出能力。',source:'新闻订阅 · 离线优先应用',article:1},
 {title:'轻量阅读工具聚焦订阅与归档',body:'围绕订阅、稍后读、搜索和归档，社区讨论了更简洁的个人阅读流程。功能是否丰富只是一个方面，日常是否容易坚持使用也影响实际价值。',source:'Hacker News · 轻量阅读工具',article:2},
 {title:'AI 工作流重视状态管理与人工确认',body:'多步骤任务需要明确记录当前状态、失败位置和人工确认环节。相关项目值得从实际任务出发评估，先验证一个完整流程，再考虑更复杂的协作。',source:'GitHub · AI 工作流项目'},
 {title:'本地模型适合哪些日常任务？',body:'本地模型可以用于资料分类、简短文本整理等个人场景。选择时需要一起考虑运行设备、速度与输出质量；仅凭榜单热度难以判断是否适合自己的任务。',source:'Hacker News · 本地模型讨论'}
];
function feed(){return '<section class="hero"><button class="summary-entry" data-mode="summary"><span>今日汇总</span><span class="eyebrow">10 月 11 日 ›</span></button>'+summaryPoints.map((p,i)=>'<button class="point-row" data-point="'+i+'"><span class="point-number">'+(i+1)+'</span><span class="point-text">'+p.title+'</span></button>').join('')+'</section>'+articles.map((a,i)=>article(a,i)).join('')}
function summaryPage(){return '<div class="eyebrow">10 月 11 日 · 今日汇总</div><h2 class="summary-title">今天最重要的五个点</h2><p class="summary-lead">根据新闻订阅与平台热点整理 · 示例内容</p>'+summaryPoints.map((p,i)=>'<section class="expanded-point" id="point-'+i+'"><h3><span>'+(i+1)+'</span>'+p.title+'</h3><p>'+p.body+'</p><button '+(p.article!==undefined?'data-article="'+p.article+'"':'data-demo="查看参考文章"')+'>'+p.source+' ↗</button></section>').join('')}

const boards=[
 {id:'github',name:'GitHub',logo:'GH',sub:'今日热门项目',rows:[['个人知识库整理工具','今日 +1,480',false],['支持状态管理的 AI 工作流','今日 +1,306',false],['文档格式转换，让知识整理更简单','今日 +1,208',true]],more:'查看完整日榜'},
 {id:'hn',name:'Hacker News',logo:'HN',sub:'热门文章',rows:[['文档格式转换，让知识整理更简单','386 分 · 126 条讨论',true,'08'],['离线优先，让阅读资料保存在本地','274 分 · 96 条讨论',false,'09'],['一个更轻量的个人阅读工具','218 分 · 72 条讨论',true,'12']],more:'查看完整热榜'},
 {id:'zhihu',name:'知乎',logo:'知',sub:'全站热榜',rows:[['有哪些值得长期坚持的阅读习惯？','328 万热度',false],['如何让个人知识库真正发挥作用？','216 万热度',false]],more:'查看完整热榜'}
];
function hot(){return boards.map(b=>'<section class="platform"><div class="platform-head"><span class="logo">'+b.logo+'</span><div class="platform-name">'+b.name+'<small>'+b.sub+'</small></div><span class="stamp">09:30 更新</span></div>'+b.rows.map((r,i)=>'<button class="ranked" '+(r[2]&&!(b.id==='hn'&&i===2)?'data-mode="detail"':'data-demo="浏览平台原条目"')+'><span class="rank">'+(r[3]||String(i+1).padStart(2,'0'))+'</span><div class="ranked-body"><div class="ranked-title">'+r[0]+'</div><div class="ranked-meta"><span>'+r[1]+'</span>'+(r[2]?'<span class="collected">✓ 已收录精选</span>':'')+'</div></div></button>').join('')+'<button class="more" data-board="'+b.id+'"><span>'+b.more+'</span><span>›</span></button></section>').join('')+'<p class="note">展示平台原始顺序。这里的排名与热度仅为设计示例。</p>'}
function detail(tab='summary'){return '<div class="eyebrow">开源项目 · 约 4 分钟</div><h2>把文档变成 Markdown，<br>让知识整理更简单</h2><p class="subtitle">microsoft / markitdown<br>来自 GitHub · 同时被 Hacker News 社区讨论</p><div class="origins"><div class="origins-title"><span>这条内容为什么入选</span><span class="eyebrow">09:30 快照</span></div><div class="origin-row"><span>GitHub Trending</span><button data-board="github">日榜第 3 名 ↗</button></div><div class="origin-row"><span>Hacker News</span><button data-board="hn">第 8 名 · 126 条讨论 ↗</button></div><div class="origin-note">多个来源合并为一条内容；排名可能随平台刷新变化。</div></div><div class="detail-tabs"><button class="'+(tab==='summary'?'selected':'')+'" data-detail-tab="summary">摘要</button><button class="'+(tab==='body'?'selected':'')+'" data-detail-tab="body">正文</button></div><div class="prose">'+(tab==='summary'?'<h3>它能帮你做什么</h3><p>将不同格式的文档转换成 Markdown，便于集中阅读、检索和继续整理。</p><h3>值得关注的地方</h3><ul><li>适合将零散文件整理进个人知识库。</li><li>可以作为资料处理流程中的一个工具。</li><li>社区讨论可补充实际使用经验与局限。</li></ul>':'<h3>让资料进入同一个阅读流程</h3><p>个人资料往往分散在不同格式的文档里。转换为统一的文本格式，可以减少后续整理和检索时的障碍。</p><p>正式版本在此呈现抓取后的 README 或原文，保留链接与结构；本段仅用于展示阅读排版。</p>')+'<p class="note">以上为界面示例文案，正式内容以来源正文为依据。</p></div>'}
function render(phone,mode){
 phone.dataset.mode=mode;
 const isDetail=mode==='detail',isSummary=mode==='summary';
 const readerHeader='<header class="backbar"><button class="icon" data-back aria-label="返回">'+icon('back')+'</button><strong>'+(isSummary?'今日汇总':'文章详情')+'</strong><button class="icon" data-demo="分享内容" aria-label="分享内容">'+icon('share')+'</button></header>';
 const homeHeader='<header class="topbar"><h2>新闻</h2><div class="tools"><button class="icon" data-demo="搜索新闻" aria-label="搜索新闻">'+icon('search')+'</button><button class="icon" data-demo="刷新新闻" aria-label="刷新新闻">'+icon('refresh')+'</button></div></header><nav class="tabs"><button class="'+(mode==='feed'?'active':'')+'" data-mode="feed">精选</button><button class="'+(mode==='hot'?'active':'')+'" data-mode="hot">热榜</button><button data-modal="sources">来源</button></nav>';
 const actions=isDetail?'<div class="detail-actions"><button data-demo="打开仓库原文">打开原文 ↗</button><button data-demo="打开 HN 评论区">看 HN 讨论 ↗</button><button data-demo="收藏文章">收藏 ＋</button></div>':'';
 phone.innerHTML=status+(isDetail||isSummary?readerHeader:homeHeader)+'<main class="content '+(isDetail?'detail':isSummary?'summary-content':'')+'">'+(isDetail?detail():isSummary?summaryPage():mode==='hot'?hot():feed())+'</main>'+actions+footer;
}

function showModal(phone,title,body){phone.querySelector('.sheet').innerHTML='<h3>'+title+'</h3>'+body+'<button data-close>返回阅读</button>';phone.querySelector('.modal').classList.add('open')}
function openDetail(phone){phone.dataset.previous=phone.dataset.mode;render(phone,'detail')}
document.querySelectorAll('.phone').forEach(p=>render(p,p.dataset.initial));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.closest('.phone');if(!p)return;if(b.hasAttribute('data-close')){p.querySelector('.modal').classList.remove('open');return}if(b.hasAttribute('data-back')){render(p,p.dataset.previous||'feed');return}if(b.dataset.point!==undefined){p.dataset.previous=p.dataset.mode;render(p,'summary');p.querySelector('#point-'+b.dataset.point).scrollIntoView({block:'start'});return}if(b.dataset.mode){if(b.dataset.mode==='detail')openDetail(p);else{p.dataset.previous=p.dataset.mode;render(p,b.dataset.mode)}return}if(b.dataset.article){if(b.dataset.article==='0')openDetail(p);else showModal(p,articles[Number(b.dataset.article)].title,'<p>'+articles[Number(b.dataset.article)].text+'</p><p>设计预览：其他文章复用当前详情结构。</p>');return}if(b.dataset.filter){p.querySelector('.content').innerHTML=feed(b.dataset.filter);return}if(b.dataset.detailTab){p.querySelector('.content').innerHTML=detail(b.dataset.detailTab);return}if(b.dataset.board){const names={github:'GitHub Trending',hn:'Hacker News',zhihu:'知乎'};showModal(p,names[b.dataset.board]+' · 榜单位置','<p>此处展示完整平台榜单，并定位当前文章。示例文章对应 GitHub 第 3 名和 HN 第 8 名；两处引用同一篇内容。</p><p>正式版本展示采集时间，并提供平台原链接。</p>');return}if(b.dataset.modal){const texts={summary:['今日汇总','今天的新闻与社区热点集中在资料处理和个人工具。文档转换项目、离线优先应用与轻量阅读工具共同构成本期阅读线索。正式版本的每个结论均可回到对应文章。'],news:['新闻订阅文章','普通新闻与热点共用阅读详情、收藏和阅读状态。该内容来自新闻订阅，不附加热榜标记。'],platforms:['关注的平台','首期展示 GitHub、Hacker News、知乎、今日头条与 V2EX。平台可以独立关注，失败时保留上次成功的榜单。'],sources:['按来源浏览','这里保留现有新闻来源，并允许浏览来自 GitHub、Hacker News 等平台的已收录文章。精选和热榜也可通过顶部标签直接切换。']};const t=texts[b.dataset.modal];showModal(p,t[0],'<p>'+t[1]+'</p>');return}if(b.dataset.demo){const toast=p.querySelector('.toast');toast.textContent='设计预览：'+b.dataset.demo+'。尚未连接真实服务。';toast.classList.add('visible');clearTimeout(p.toastTimer);p.toastTimer=setTimeout(()=>toast.classList.remove('visible'),2400)}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))});
</script>
</body>
