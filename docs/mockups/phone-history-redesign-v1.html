<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>处理记录 · 紧凑列表设计稿</title>
<style>
:root{--bg:#000;--surface:#1c1c1e;--high:#2c2c2e;--fg:#f5f5f7;--muted:#a1a1a6;--primary:#0a84ff;--line:#ffffff20;--danger:#ff453a}
*{box-sizing:border-box}body{margin:0;padding:32px 36px 36px;background:#e2e7ec;color:#1d1d1f;font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}h1{margin:0;font-size:25px;letter-spacing:.5px}.intro{font-size:14px;color:#596572;margin:10px 0 24px;line-height:1.7}.board{display:flex;gap:26px;align-items:flex-start}.column{width:390px;flex:none}.caption{font-size:13px;font-weight:600;margin-bottom:12px}.caption span{color:#65717e;font-weight:400;margin-left:8px}.phone{height:844px;width:390px;border-radius:30px;background:var(--bg);color:var(--fg);overflow:hidden;position:relative;box-shadow:0 16px 36px #26384d24;display:flex;flex-direction:column}.light{--bg:#f5f5f7;--surface:#fff;--high:#efeff4;--fg:#1d1d1f;--muted:#6e6e73;--primary:#006edb;--line:#3c3c4314;--danger:#c0342c}.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600}.status .signals{font-size:12px;letter-spacing:1px}.topbar{height:54px;flex:none;display:flex;align-items:center;padding:0 8px}.topbar strong{flex:1;text-align:center;font-size:17px;font-weight:600}.topbar .space{width:44px}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}.icon-button{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%}.icon-button:hover{background:var(--high)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.content{flex:1;overflow:auto;scrollbar-width:none;padding:8px 16px 20px}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:0 4px 16px}.record{background:var(--surface);border-radius:16px;padding:12px 16px 4px;margin-bottom:12px;position:relative}.record-head{display:flex;align-items:center;gap:10px}.source-icon{height:34px;width:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--high)}.source-icon svg{width:18px;height:18px}.identity{min-width:0;flex:1}.origin{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:12px;color:var(--muted);margin-top:4px}.more{margin-right:-10px;color:var(--muted)}.result{font-size:13px;line-height:20px;margin:12px 0 10px;color:var(--muted)}.result b{font-weight:600;color:var(--fg)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px;border-top:1px solid var(--line)}.text-button{color:var(--primary);font-size:13px;font-weight:500;min-height:48px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;gap:4px}.text-button:hover{opacity:.75}.actions .view{margin-left:auto;color:var(--muted)}.view svg{height:14px;width:14px}.source-text{display:none;background:var(--high);border-radius:10px;padding:12px;font-size:13px;line-height:1.7;margin:0 0 12px;overflow-wrap:anywhere}.record.expanded .source-text{display:block}.record.expanded .view svg{transform:rotate(180deg)}.notice{font-size:12px;color:var(--muted);display:flex;gap:8px;line-height:1.6;padding:8px 4px 4px}.notice svg{width:16px;height:16px;flex:none;margin-top:2px}.home{height:25px;display:flex;align-items:center;justify-content:center;flex:none}.home:after{content:"";width:134px;height:5px;background:var(--muted);border-radius:10px;opacity:.65}.erased{font-size:12px;color:var(--muted);margin:0 0 12px}.menu{position:absolute;right:10px;top:55px;width:224px;border-radius:12px;padding:4px;background:var(--high);box-shadow:0 10px 30px #0005;z-index:5;display:none;overflow:hidden;border:1px solid var(--line)}.record.menu-open .menu{display:block}.menu button{min-height:48px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;font-size:14px}.menu button:hover{background:var(--line)}.menu svg{width:18px;height:18px;color:var(--muted);flex:none}.menu .destructive{color:var(--danger)}.menu .destructive svg{color:var(--danger)}.menu .separator{height:1px;background:var(--line);margin:4px 8px}.footnote{font-size:12px;color:#65717e;line-height:1.7;margin:14px 2px 0}.demo-toast{position:absolute;bottom:40px;left:20px;right:20px;padding:12px;background:var(--high);color:var(--fg);border-radius:12px;font-size:12px;display:none;z-index:10}.demo-toast.visible{display:block}@media(max-width:700px){body{padding:24px 16px}.board{flex-direction:column;align-items:center}.column{max-width:100%}.phone{max-width:100%}}
</style>
</head>
<body>
<h1>处理记录 · 设计稿 v1</h1>
<p class="intro">保留来源与处理结果，让一屏能看更多记录。常用补建操作留在卡片底部，低频操作归入「更多」。<br>可点击「原文」与「⋯」预览交互；内容为示例，不执行真实操作。</p>
<div class="board">
<section class="column"><div class="caption">A · 默认列表<span>深色 / 紧凑信息层级</span></div><div class="phone" id="dark-list"></div><p class="footnote">来源保持一行，长名称省略；时间不显示秒与毫秒。<br>没有生成结果时仍能快速补建待办与账目。</p></section>
<section class="column"><div class="caption">B · 展开原文<span>浅色 / 保留阅读空间</span></div><div class="phone light" id="light-expanded"></div><p class="footnote">原文仅在需要时展开；清除后明确标记。<br>已有账目时隐藏「补建账目」，沿用现有操作条件。</p></section>
<section class="column"><div class="caption">C · 更多操作<span>深色 / 危险操作分隔</span></div><div class="phone" id="dark-menu"></div><p class="footnote">菜单按记录状态显示重试、重新识别与 AI 二次处理。<br>清除原文仍需二次确认；屏蔽来源沿用现有逻辑。</p></section>
</div>
<script>
const paths={back:'<path d="m14 5-7 7 7 7M7 12h14"/>',sms:'<path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/>',bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 3 6 3 7H3c0-1 3-2 3-7M10 20h4"/>',more:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',down:'<path d="m6 9 6 6 6-6"/>',retry:'<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',block:'<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const rows=[
{channel:'短信',origin:'10000',time:'2026-10-11 09:49',todos:0,ledger:0,text:'【中国电信】尊敬的客户，您本月套餐使用情况已更新。详情请登录电信营业厅查询。',reprocess:true},
{channel:'通知',origin:'com.tencent.mm',time:'2026-10-08 18:42',todos:0,ledger:1,text:'微信支付：已支付 ¥28.00，商户：便利店。'},
{channel:'通知',origin:'com.eg.android.AlipayGphone',time:'2026-10-08 12:06',todos:1,ledger:0,text:'您的快递已到达驿站，请于今天 20:00 前领取。'},
{channel:'短信',origin:'95588',time:'2026-10-07 16:30',todos:0,ledger:1,erased:true}
];
function menu(row){return `<div class="menu" role="menu">${row.reprocess?`<button role="menuitem" data-demo="重新识别">${icon('retry')}重新识别</button><button role="menuitem" data-demo="AI 二次处理">${icon('spark')}交给 AI 二次处理</button><div class="separator"></div>`:''}${!row.erased?`<button role="menuitem" class="destructive" data-demo="清除原文">${icon('trash')}清除原文</button>`:''}<button role="menuitem" data-demo="屏蔽此来源">${icon('block')}屏蔽此来源</button></div>`}
function card(row,index,mode){const expanded=mode==='expanded'&&index===0;return `<article class="record ${expanded?'expanded':''} ${mode==='menu'&&index===0?'menu-open':''}"><div class="record-head"><span class="source-icon">${icon(row.channel==='短信'?'sms':'bell')}</span><div class="identity"><div class="origin" title="${row.channel} · ${row.origin}">${row.channel} · ${row.origin}</div><div class="time">${row.time}</div></div><button class="icon-button more" aria-label="更多操作" aria-expanded="${mode==='menu'&&index===0}">${icon('more')}</button></div><p class="result">已生成 <b>${row.todos}</b> 个待办 · <b>${row.ledger}</b> 个账目</p>${row.erased?'<p class="erased">原文已清除</p>':''}<div class="actions"><button class="text-button" data-demo="补建待办">补建待办</button>${row.ledger===0?'<button class="text-button" data-demo="补建账目">补建账目</button>':''}${!row.erased?`<button class="text-button view" aria-expanded="${expanded}"><span>${expanded?'收起原文':'原文'}</span>${icon('down')}</button>`:''}</div>${!row.erased?`<div class="source-text">${row.text}</div>`:''}${menu(row)}</article>`}
function render(id,mode){document.getElementById(id).innerHTML=`<div class="status"><span>13:24</span><span class="signals">5G ▰▰ ◉ ▰</span></div><header class="topbar"><button class="icon-button" aria-label="返回" data-demo="返回">${icon('back')}</button><strong>处理记录</strong><span class="space"></span></header><main class="content"><p class="hint">查看短信与通知的处理结果，也可补建待办或账目。</p>${rows.map((r,i)=>card(r,i,mode)).join('')}<div class="notice">${icon('lock')}<span>原文加密保存在本机。清除原文不会影响已生成的待办与账目。</span></div></main><div class="home"></div><div class="demo-toast" role="status"></div>`}
render('dark-list','list');render('light-expanded','expanded');render('dark-menu','menu');
document.addEventListener('click',e=>{const more=e.target.closest('.more');if(more){const record=more.closest('.record');const wasOpen=record.classList.contains('menu-open');record.closest('.phone').querySelectorAll('.menu-open').forEach(r=>{r.classList.remove('menu-open');r.querySelector('.more').setAttribute('aria-expanded','false')});record.classList.toggle('menu-open',!wasOpen);more.setAttribute('aria-expanded',String(!wasOpen));return}const view=e.target.closest('.view');if(view){const expanded=view.closest('.record').classList.toggle('expanded');view.querySelector('span').textContent=expanded?'收起原文':'原文';view.setAttribute('aria-expanded',String(expanded));return}const action=e.target.closest('[data-demo]');if(action){const phone=action.closest('.phone');const toast=phone.querySelector('.demo-toast');toast.textContent=action.dataset.demo==='清除原文'?'设计说明：此处弹出清除确认，已生成的待办与账目不受影响。':`设计预览：${action.dataset.demo}，不执行真实操作。`;toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),2600)}document.querySelectorAll('.menu-open').forEach(r=>{r.classList.remove('menu-open');r.querySelector('.more').setAttribute('aria-expanded','false')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.menu-open').forEach(r=>{r.classList.remove('menu-open');r.querySelector('.more').setAttribute('aria-expanded','false')})});
</script>
</body>
</html>
