<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据管理第二版设计预览</title>
<style>
:root{color-scheme:dark;--bg:#101014;--card:#1d1d23;--text:#f3f3f7;--muted:#92929e;--line:#303039;--blue:#3699ff;--green:#70d2aa}
*{box-sizing:border-box}body{margin:0;background:#23252b;color:var(--text);font-family:"Noto Sans CJK SC",sans-serif;padding:28px 36px}h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px}.board-note{font-size:13px;color:#b2b4c1;margin:0 0 22px}.screens{display:flex;gap:28px;justify-content:center}.label{font-size:12px;color:#b2b4c1;margin:0 0 10px 6px}.phone{width:390px;height:814px;border-radius:28px;background:var(--bg);overflow:hidden;position:relative;border:1px solid #3b3c43;box-shadow:0 16px 40px #0003}.status{height:36px;padding:12px 22px 0;font-size:12px;font-weight:600;display:flex;justify-content:space-between}.toolbar{height:58px;display:flex;align-items:center;padding:0 20px;position:relative}.toolbar h2{font-size:18px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.tabs{margin:6px 20px 0;padding:4px;display:flex;background:#222229;border-radius:12px;height:44px}.tabs button{width:50%;border-radius:9px;color:var(--muted);font-size:14px}.tabs .active{background:#393942;color:var(--text);box-shadow:0 1px 4px #0003;font-weight:600}.content{padding:28px 20px}.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-heading h3{font-size:19px;margin:0;font-weight:600}.badge{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--green)}.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}.card{border-radius:16px;background:var(--card);overflow:hidden}.setting{padding:18px 16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}.setting+.setting{position:relative}.setting+.setting:before{content:"";position:absolute;top:0;left:58px;right:16px;border-top:1px solid var(--line)}.icon{display:flex;align-items:center;justify-content:center;width:30px;flex:none;color:var(--blue)}.setting .copy{flex:1;min-width:0}.setting strong{font-weight:500;font-size:15px;display:block}.setting small{display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}.chevron{color:#747480;width:16px;height:16px}.value{font-size:12px;color:var(--muted);white-space:nowrap}.primary{height:48px;width:100%;border-radius:12px;background:var(--blue);color:#071e35;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}.primary svg{width:19px;height:19px}.caption{font-size:12px;line-height:1.8;color:var(--muted);margin:12px 4px 0}.divider{height:1px;background:var(--line);margin:28px 0 24px}.verify{display:flex;align-items:center;gap:12px}.verify .icon{color:#a5b4c7}.verify .copy{flex:1}.verify strong{font-weight:500;font-size:14px}.verify p{font-size:12px;color:var(--muted);line-height:1.7;margin:5px 0 0}.text-action{font-size:13px;color:var(--blue);padding:9px 0 9px 10px;white-space:nowrap}.quiet-note{font-size:11px;color:#6f6f7c;margin:20px 0;text-align:center;line-height:1.8}.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);height:4px;width:112px;background:#d3d3da;border-radius:4px}.choose{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--blue);padding:0}.choose svg{height:17px;width:17px}.backup-option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:19px 16px;border-bottom:1px solid var(--line)}.backup-option:last-child{border-bottom:0}.backup-option.selected{background:#3699ff10}.file-icon{color:#818da0;width:20px;height:24px}.selected .file-icon{color:var(--blue)}.backup-option .copy{flex:1}.backup-option strong{font-weight:500;display:block;font-size:14px;font-variant-numeric:tabular-nums}.backup-option small{color:var(--muted);display:block;font-size:11px;margin-top:7px}.radio{width:18px;height:18px;border:1.5px solid #656572;border-radius:50%;flex:none}.selected .radio{border:5px solid var(--blue)}.list-meta{font-size:12px;color:var(--muted);margin:0 0 14px 0}.warning{display:flex;align-items:flex-start;gap:7px;margin-top:20px;color:#afa8a0;font-size:12px;line-height:1.8}.warning svg{width:16px;height:16px;margin-top:3px;color:#d3b991}.count{font-size:12px;color:#6f6f7c;text-align:center;margin-top:16px}.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009;padding:28px;z-index:2}.modal.open{display:flex}.dialog{border-radius:20px;background:#292931;padding:24px;width:100%;box-shadow:0 8px 32px #0005}.dialog h3{font-size:18px;margin:0 0 14px}.dialog p{font-size:12px;color:var(--muted);line-height:1.8}.dialog input{width:100%;background:#1b1b21;color:var(--text);border:1px solid #555563;border-radius:10px;height:46px;padding:0 12px;font:inherit;font-size:13px;margin:10px 0 20px}.dialog-actions{display:flex;justify-content:flex-end;gap:20px;font-size:13px}.dialog-actions button:last-child{color:var(--blue)}.toast{position:absolute;bottom:35px;left:25px;right:25px;background:#353541;padding:12px;border-radius:10px;font-size:12px;text-align:center;z-index:3;display:none}.toast.visible{display:block}
</style>
<h1>数据管理 · 第二版</h1>
<p class="board-note">设计预览，备份日期与目录为示例。收紧层级与间距，让操作紧随内容。</p>
<div class="screens">
<section><p class="label">01 / 备份</p><div class="phone" id="backup">
<div class="status"><span>01:29</span><span>▂▄▆　◒　87%</span></div>
<header class="toolbar"><svg><path d="m14 5-7 7 7 7M7 12h14"/></svg><h2>数据管理</h2></header>
<nav class="tabs"><button class="active">备份</button><button onclick="document.querySelector('#restore').scrollIntoView({behavior:'smooth',block:'center'})">恢复</button></nav>
<main class="content">
<div class="section-heading"><h3>备份设置</h3><span class="badge">加密保护</span></div>
<div class="card">
<button class="setting" onclick="notice(this,'设计预览：选择备份保存目录')"><span class="icon"><svg><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></span><span class="copy"><strong>备份目录</strong><small>内部存储 / Backups / Daily</small></span><svg class="chevron"><path d="m9 6 6 6-6 6"/></svg></button>
<button class="setting" onclick="openDialog(this,'修改备份密码','新密码至少 10 位。恢复旧备份仍需创建时的密码。','保存密码')"><span class="icon"><svg><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><span class="copy"><strong>加密密码</strong><small>已设置，创建备份时自动使用</small></span><span class="value">修改</span><svg class="chevron"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
<button class="primary" onclick="notice(this,'设计预览，不会创建真实备份')"><svg><path d="M7 18H5a4 4 0 0 1-1-7.8A7 7 0 0 1 17 8a5 5 0 0 1 2 10h-2M12 20V11m-4 4 4-4 4 4"/></svg>立即备份</button>
<p class="caption">备份包含应用数据与附件。请妥善保存密码，恢复时需要手动输入。</p>
<div class="divider"></div>
<div class="verify"><span class="icon"><svg><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Zm-4 9 3 3 5-6"/></svg></span><div class="copy"><strong>验证最近备份</strong><p>检查完整性，不覆盖当前数据</p></div><button class="text-action" onclick="openDialog(this,'验证最近备份','输入创建此备份时的密码。仅用于本次验证，不会更改已保存的密码。','开始验证')">验证</button></div>
</main><div class="home"></div><div class="modal"></div><div class="toast"></div></div></section>
<section><p class="label">02 / 恢复</p><div class="phone" id="restore">
<div class="status"><span>01:29</span><span>▂▄▆　◒　87%</span></div>
<header class="toolbar"><svg><path d="m14 5-7 7 7 7M7 12h14"/></svg><h2>数据管理</h2></header>
<nav class="tabs"><button onclick="document.querySelector('#backup').scrollIntoView({behavior:'smooth',block:'center'})">备份</button><button class="active">恢复</button></nav>
<main class="content">
<div class="section-heading"><h3>选择备份</h3><button class="choose" onclick="notice(this,'设计预览：选择其他位置的加密备份')"><svg><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>选择文件</button></div>
<p class="list-meta">备份目录中的文件</p>
<div class="card" role="radiogroup" aria-label="备份文件">
<button class="backup-option selected" role="radio" aria-checked="true" onclick="selectBackup(this)"><svg class="file-icon"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 14h8m-8 3h5"/></svg><span class="copy"><strong>2026-10-12　01:29</strong><small>加密备份 · 最近一次</small></span><span class="radio"></span></button>
<button class="backup-option" role="radio" aria-checked="false" onclick="selectBackup(this)"><svg class="file-icon"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 14h8m-8 3h5"/></svg><span class="copy"><strong>2026-10-11　23:18</strong><small>加密备份</small></span><span class="radio"></span></button>
<button class="backup-option" role="radio" aria-checked="false" onclick="selectBackup(this)"><svg class="file-icon"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 14h8m-8 3h5"/></svg><span class="copy"><strong>2026-10-10　22:06</strong><small>加密备份</small></span><span class="radio"></span></button>
</div>
<button class="primary" onclick="openDialog(this,'确认恢复','恢复将替换当前数据，完成后自动重启。请输入创建此备份时的密码。','恢复并重启')"><svg><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/></svg>恢复此备份</button>
<div class="warning"><svg><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3h.01"/></svg><span>恢复会替换当前数据。<br>请先备份需要保留的内容。</span></div>
<p class="count">共 3 份备份</p>
</main><div class="home"></div><div class="modal"></div><div class="toast"></div></div></section>
</div>
<script>
document.querySelectorAll('svg').forEach(svg=>svg.setAttribute('viewBox','0 0 24 24'));
function selectBackup(button){button.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('selected',b===button);b.setAttribute('aria-checked',String(b===button))})}
function notice(button,text){const t=button.closest('.phone').querySelector('.toast');t.textContent=text;t.classList.add('visible');setTimeout(()=>t.classList.remove('visible'),2200)}
function openDialog(button,title,description,confirm){const modal=button.closest('.phone').querySelector('.modal');modal.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3><p>${description}</p><input type="password" autocomplete="off" placeholder="输入备份密码"><div class="dialog-actions"><button onclick="closeDialog(this)">取消</button><button onclick="closeDialog(this)">${confirm}</button></div></div>`;modal.classList.add('open')}
function closeDialog(button){const m=button.closest('.modal');m.classList.remove('open');m.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('open');m.innerHTML=''})});
</script>
</html>
