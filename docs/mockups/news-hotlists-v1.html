<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻热榜 · 手机界面提案</title>
<style>
:root{--primary:#006edb;--primary-soft:#d8ecff;--bg:#f5f5f7;--surface:#fff;--surface-high:#efeff4;--ink:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--s:8px;--m:16px;--l:24px;--radius:22px;--font:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--small:12px;--body:14px;--title:28px}
*{box-sizing:border-box}body{margin:0;padding:32px 40px;background:var(--surface-high);color:var(--ink);font-family:var(--font)}button,a{font:inherit}button{border:0;cursor:pointer;background:none;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:hover{opacity:.8}h1{font-size:26px;margin:0 0 var(--s)}.intro{color:var(--muted);font-size:var(--body);margin:0 0 var(--l);line-height:1.7}.board{display:flex;gap:var(--l);align-items:flex-start}.column{width:390px;flex:none}.caption{font-size:var(--body);font-weight:700;margin:0 0 12px}.caption span{font-weight:400;color:var(--muted);margin-left:var(--s)}.phone{background:var(--bg);height:800px;border-radius:32px;border:1px solid var(--line);box-shadow:0 12px 30px #1d1d1f0c;overflow:hidden;display:flex;flex-direction:column;position:relative}.status{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--l);font-size:var(--small);font-weight:700;flex:none}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}.topbar h2{font-size:var(--title);margin:0;letter-spacing:-1px}.tools{display:flex;gap:var(--s)}.tool{height:34px;min-width:34px;border-radius:50%;background:var(--surface);font-size:20px;color:var(--muted)}.tabs{display:flex;gap:var(--l);padding:0 20px;border-bottom:1px solid var(--line);flex:none}.tabs button{font-size:15px;padding:10px 0 12px;color:var(--muted);position:relative}.tabs .active{color:var(--primary);font-weight:700}.tabs .active:after{content:"";position:absolute;height:3px;background:var(--primary);bottom:-1px;left:0;right:0;border-radius:3px}.content{overflow:auto;scrollbar-width:none;flex:1;padding:var(--m)}.content::-webkit-scrollbar{display:none}.section-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}.eyebrow{font-size:var(--small);color:var(--muted);line-height:1.6}.link{color:var(--primary);font-size:var(--small);padding:var(--s) 0}.card{border-radius:var(--radius);background:var(--surface);margin-bottom:12px;padding:var(--m);border:1px solid var(--line)}.platform-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.badge{width:32px;height:32px;display:grid;place-items:center;background:var(--surface-high);border-radius:10px;font-size:var(--small);font-weight:700;flex:none}.platform-name{font-size:15px;font-weight:700;flex:1}.platform-name small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:3px}.stamp{color:var(--muted);font-size:11px}.mini-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font-size:13px;line-height:1.7;padding:7px 0}.rank{color:var(--muted);min-width:18px;font-size:var(--small);font-variant-numeric:tabular-nums}.rank.top{color:var(--primary);font-weight:700}.mini-row .text{flex:1}.mini-row .metric{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:2px}.more{display:flex;width:100%;justify-content:space-between;border-top:1px solid var(--line);margin-top:var(--s);padding:12px 0 0;color:var(--primary);font-size:var(--small)}.source-tabs{display:flex;gap:var(--s);overflow:auto;scrollbar-width:none;padding-bottom:var(--m)}.chip{white-space:nowrap;padding:7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;font-size:var(--small)}.chip.selected{color:var(--primary);background:var(--primary-soft);border-color:var(--primary-soft);font-weight:700}.list-heading{margin:4px 2px var(--m)}.list-heading h3{margin:0 0 var(--s);font-size:22px;letter-spacing:-.5px}.list-heading .sub{font-size:var(--small);color:var(--muted);line-height:1.7}.controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--m)}.segmented{display:flex;background:var(--surface-high);padding:3px;border-radius:10px}.segmented button{padding:5px 14px;font-size:var(--small);border-radius:7px;color:var(--muted)}.segmented button.selected{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #1d1d1f12}.select{font-size:var(--small);color:var(--muted);padding:var(--s)}.item{display:flex;gap:12px}.item-body{flex:1;min-width:0}.item h4{margin:0 0 var(--s);font-size:15px;line-height:1.55;overflow-wrap:anywhere}.item p{font-size:13px;line-height:1.75;margin:0 0 12px;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);line-height:1.7}.growth{color:var(--primary)}.item-actions{display:flex;gap:var(--m);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.item-actions button{font-size:var(--small);color:var(--primary);padding:3px 0}.item-actions button:last-child{margin-left:auto;color:var(--muted)}.original{font-size:var(--small)!important;line-height:1.6!important;margin-bottom:10px!important;color:var(--muted)}.small-note{font-size:11px;color:var(--muted);padding:var(--s) 2px;line-height:1.7}.demo-label{font-size:10px;text-align:center;color:var(--muted);padding:var(--s);border-top:1px solid var(--line);background:var(--bg);flex:none}.home{height:20px;display:grid;place-items:center;flex:none}.home:after{content:"";width:100px;height:4px;border-radius:4px;background:var(--ink)}.footnote{font-size:var(--small);line-height:1.8;color:var(--muted);margin:12px 2px 0}.toast{position:absolute;bottom:52px;left:20px;right:20px;background:var(--ink);color:var(--surface);padding:12px;border-radius:12px;font-size:var(--small);line-height:1.7;display:none;z-index:3}.toast.visible{display:block}.modal{position:absolute;inset:0;background:#1d1d1f40;z-index:4;align-items:flex-end;display:none}.modal.open{display:flex}.sheet{width:100%;background:var(--surface);padding:var(--l);border-radius:var(--radius) var(--radius) 0 0}.sheet h3{font-size:18px;margin:0 0 var(--m)}.sheet p{font-size:var(--body);line-height:1.9;color:var(--muted)}.sheet a{color:var(--primary);display:block;font-size:var(--small);overflow-wrap:anywhere;padding:var(--s) 0}.sheet .close{color:var(--primary);width:100%;padding:var(--m);margin-top:var(--s);background:var(--primary-soft);border-radius:12px}@media(max-width:800px){body{padding:var(--l) var(--m)}.board{flex-direction:column;align-items:center}.column{max-width:100%}.phone{max-width:100%}}
</style>
</head>
<body>
<h1>把真正的热点，放进每日阅读</h1>
<p class="intro">Daily Satori · 热榜界面提案　／　以下标题、排名、时间与热度均为示例，不代表实时榜单。可点击平台、来源说明与条目操作。</p>
<div class="board">
<section class="column"><p class="caption">01 平台总览<span>快速看各处在讨论什么</span></p><div class="phone" id="overview"></div><p class="footnote">每个平台一张榜单卡，默认展示前 3 条。<br>排名沿用原平台；点击“查看榜单”进入完整列表。</p></section>
<section class="column"><p class="caption">02 GitHub 榜单<span>项目简介与增长一眼可见</span></p><div class="phone" id="github"></div><p class="footnote">支持日榜 / 周榜；保留仓库名与中文简介。<br>提供仓库原链接，明确区分总 Stars 与区间新增。</p></section>
<section class="column"><p class="caption">03 Hacker News 榜单<span>文章与讨论都能读</span></p><div class="phone" id="hackernews"></div><p class="footnote">保留原题，中文标题与简介可异步生成。<br>“读原文”和“看讨论”分别进入文章与 HN 评论区。</p></section>
</div>
<script>
const sources={
 github:{name:'GitHub',subtitle:'Trending · 今日热门项目',badge:'GH',url:'https://github.com/trending?since=daily',description:'来自 GitHub Trending 页面，按原始榜单顺序展示。日榜与周榜分别采集，不用总 Stars 排序冒充热榜。',items:[['microsoft / markitdown','把文档、网页和多媒体内容转换成 Markdown，便于检索和知识整理。','Python · ☆ 82.6k','今日 +1,208'],['langchain-ai / langgraph','构建有状态的 AI 工作流，支持多步骤任务与人工确认。','Python · ☆ 28.3k','今日 +863'],['ollama / ollama','在本地运行和管理开源模型，为个人应用提供模型服务。','Go · ☆ 128.5k','今日 +625']]},
 hackernews:{name:'Hacker News',subtitle:'Top Stories · 社区热门',badge:'HN',url:'https://github.com/HackerNews/API',description:'来自 HN 官方 API 的 topstories 列表，再通过 item 获取标题、分数与评论数。列表保持官方排序；有外链的条目同时提供原文和讨论入口。',items:[['让个人知识库的数据真正属于自己','讨论本地优先软件的数据存储、离线体验与长期可迁移性。','386 分 · 148 条评论','2 小时前','Local-first software and ownership of personal data'],['Show HN：一个更轻量的个人阅读工具','一位开发者分享自己的阅读工具，社区讨论订阅、归档与搜索体验。','274 分 · 96 条评论','3 小时前','Show HN: A small tool for a calmer reading workflow'],['为什么小型模型也值得关注','从运行成本、隐私与延迟出发，讨论小型模型适合的实际任务。','218 分 · 72 条评论','4 小时前','Finding practical uses for smaller language models']]},
 zhihu:{name:'知乎',subtitle:'全站热榜',badge:'知',url:'https://www.zhihu.com/hot',description:'拟使用知乎网页热榜请求：/api/v3/feed/topstory/hot-list-web?limit=20&desktop=true。它是网页内部接口，接入前需要实测，并保留更新时间与缓存失败状态。',items:[['有哪些值得长期坚持的阅读习惯？','','328 万热度',''],['如何让个人知识库真正发挥作用？','','216 万热度',''],['你最近发现了哪些好用的开源工具？','','189 万热度','']]},
 toutiao:{name:'今日头条',subtitle:'头条热榜',badge:'头',url:'https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc',description:'拟使用头条网页热榜内部接口 /hot-event/hot-board/?origin=toutiao_pc，保留平台标题、顺序、原始热度与话题链接。接入前需验证服务器可访问性。',items:[['多地迎来秋季出游高峰','','热榜第 1',''],['新技术如何进入我们的日常生活','','热榜第 2',''],['城市公共阅读空间持续增加','','热榜第 3','']]},
 v2ex:{name:'V2EX',subtitle:'社区热门主题',badge:'V2',url:'https://www.v2ex.com/api/topics/hot.json',description:'热门主题拟使用 V2EX /api/topics/hot.json；最新分享则来自公开节点 Feed，按时间排序。两种榜单分开标注。',items:[['分享一下你的个人知识管理方案','','128 回复',''],['大家最近在用什么阅读工具？','','86 回复',''],['做了一个离线可用的小应用','','72 回复','']]}
};
function shell(){return '<div class="status"><span>09:41</span><span>5G ▰▰ ▰</span></div><header class="topbar"><h2>新闻</h2><div class="tools"><button class="tool" data-action="搜索新闻" aria-label="搜索新闻">⌕</button><button class="tool" data-action="刷新榜单" aria-label="刷新榜单">↻</button></div></header><nav class="tabs"><button data-action="今日精选">精选</button><button class="active" data-mode="overview">热榜</button><button data-action="现有新闻来源">来源</button></nav><main class="content"></main><div class="demo-label">设计预览 · 示例数据</div><div class="home"></div><div class="toast" role="status"></div><div class="modal" role="dialog" aria-modal="true" aria-label="来源说明"><div class="sheet"></div></div>'}
function overview(){return '<div class="section-head"><span class="eyebrow">各平台热榜<br>按平台原始排名展示</span><button class="link" data-action="管理关注的平台">管理平台 ›</button></div>'+Object.entries(sources).map(([key,s])=>'<article class="card"><div class="platform-head"><span class="badge">'+s.badge+'</span><div class="platform-name">'+s.name+'<small>'+s.subtitle+'</small></div><span class="stamp">09:30</span></div>'+s.items.map((r,i)=>'<button class="mini-row" data-open="'+key+'"><span class="rank top">0'+(i+1)+'</span><span class="text">'+r[0]+'</span></button>').join('')+'<button class="more" data-open="'+key+'"><span>查看榜单</span><span>›</span></button></article>').join('')+'<p class="small-note">小红书创作热点：数据来源确认后再接入。</p>'}
function listing(key,period='daily'){const s=sources[key];return '<div class="source-tabs"><button class="chip" data-mode="overview">全部平台</button>'+Object.entries(sources).map(([k,v])=>'<button class="chip '+(k===key?'selected':'')+'" data-open="'+k+'">'+v.name+'</button>').join('')+'</div><div class="list-heading"><h3>'+s.name+'</h3><div class="sub">'+s.subtitle+' · 示例更新于 09:30</div></div><div class="controls">'+(key==='github'?'<div class="segmented"><button class="'+(period==='daily'?'selected':'')+'" data-period="daily">今日</button><button class="'+(period==='weekly'?'selected':'')+'" data-period="weekly">本周</button></div>':'<span class="eyebrow">保持平台榜单顺序</span>')+'<button class="link" data-info="'+key+'">来源说明 ⓘ</button></div>'+s.items.map((r,i)=>'<article class="card item"><span class="rank top">0'+(i+1)+'</span><div class="item-body"><h4>'+r[0]+'</h4>'+(r[4]?'<p class="original">'+r[4]+'</p>':'')+(r[1]?'<p>'+r[1]+'</p>':'')+'<div class="meta"><span>'+r[2]+'</span><span class="'+(key==='github'?'growth':'')+'">'+(key==='github'&&period==='weekly'?'周榜数据待接入':r[3])+'</span></div><div class="item-actions"><button data-action="'+(key==='github'?'打开仓库':'读原文')+'">'+(key==='github'?'打开仓库 ↗':'读原文 ↗')+'</button>'+(key==='hackernews'?'<button data-action="打开 HN 讨论">看讨论 ↗</button>':'')+'<button data-action="收藏条目">收藏 ＋</button></div></div></article>').join('')+'<p class="small-note">'+(key==='hackernews'?'中文标题与简介为展示示例；正式版本保留原题，翻译未完成时先显示原题。':'各条目保留平台原链接。榜单刷新失败时展示上次数据和实际更新时间。')+'</p>'}
function render(phone,key){phone.dataset.source=key;phone.querySelector('.content').innerHTML=key==='overview'?overview():listing(key);phone.querySelector('.content').scrollTop=0}
document.querySelectorAll('.phone').forEach(p=>{p.innerHTML=shell();render(p,p.id)});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const phone=button.closest('.phone');if(!phone)return;if(button.dataset.open){render(phone,button.dataset.open);return}if(button.dataset.mode){render(phone,button.dataset.mode);return}if(button.dataset.period){phone.querySelector('.content').innerHTML=listing('github',button.dataset.period);return}if(button.dataset.info){const s=sources[button.dataset.info];phone.querySelector('.sheet').innerHTML='<h3>'+s.name+' · 数据来源</h3><p>'+s.description+'</p><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">查看源页面或接口 ↗</a><button class="close">知道了</button>';phone.querySelector('.modal').classList.add('open');return}if(button.classList.contains('close')){phone.querySelector('.modal').classList.remove('open');return}if(button.dataset.action){const toast=phone.querySelector('.toast');toast.textContent='设计预览：'+button.dataset.action+'。尚未连接真实服务。';toast.classList.add('visible');clearTimeout(phone.toastTimer);phone.toastTimer=setTimeout(()=>toast.classList.remove('visible'),2400)}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))});
</script>
</body>
</html>
