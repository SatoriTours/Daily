{type:'决策准备',title:'续费前，先看清哪些订阅真的在使用',why:'你希望少做重复决定，月底花十分钟核对使用记录就很有价值。',news:'订阅服务调整套餐结构',fact:'这篇演示新闻描述了一项套餐结构调整，具体是否影响你的订阅需要查看自己的合同和账单。',relation:'结合示例观点「把精力留给重要的事」，先做一次轻量核对可能减少长期无效支出。这不等于建议立即停用。',action:'列出本月使用过的 3 项订阅，并在下一次续费前核对价格和替代成本。',risk:'以实际账单为准，注意年度承诺、迁移成本和服务连续性。',source:'演示产品观察',kind:'订阅使用核对',context:'机会点：续费前，先看清哪些订阅真的在使用'}];
const baseReminders=[{title:'给我的 GLM 套餐续费',date:'2026-10-04',time:'09:00',repeat:'每年'},{title:'手机卡充值，确认余额',date:'2026-10-05',time:'09:00',repeat:'每月'}];
const $=s=>document.querySelector(s);
function toast(t){$('#toast').className='toast';$('#toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},3200)}
function go(page){state.stack.push({page:state.page,scroll:$('#content').scrollTop});state.page=page;render();$('#content').scrollTop=0}
function back(){const last=state.stack.pop();state.page=last?.page||'home';render();$('#content').scrollTop=last?.scroll||0}
function selectPage(page){state.stack=[];state.page=page;render();$('#content').scrollTop=0}
function title(t,action=''){return `<button class="icon" data-act="back" aria-label="返回">${icon('back')}</button><h2>${t}</h2>${action}`}
function sectionHead(t,page,label='全部'){return `<div class="section-title"><h3>${t}</h3><button class="link" data-go="${page}">${label}${icon('arrow')}</button></div>`}
function empty(t,p,button){return `<div class="empty"><h3>${t}</h3><p>${p}</p>${button||''}</div>`}
function statusNotice(){if(state.mode==='loading')return '<div class="notice"><strong>正在整理新的内容</strong>思想：整合观点 · 新闻：分析 3/5 篇<div class="progress"><span></span></div>仍可查看上次结果；保存完成后才会更新。</div>';if(state.mode==='error')return '<div class="notice error"><strong>本次更新未完成</strong>整合阶段失败，已保留上次结果和本次进度。<br><button class="link" data-act="retry">从已保存进度继续 →</button></div>';return ''}
function reminderRow(r,i){const parts=r.date.split('-');return `<button class="row" data-reminder="${i}"><span class="date"><b>${Number(parts[2])}</b><span>${Number(parts[1])} 月</span></span><span class="row-main"><strong>${escapeHtml(r.title)}</strong><small>${r.time} <span class="tag green">${r.repeat}</span></small></span>${chevron()}</button>`}
function opportunityCard(o,i){return `<button class="opportunity" data-opportunity="${i}"><h3>${o.title}</h3><p>${o.why}</p><div class="meta">${o.type} · 9 月 20 日${state.saved.has(i)?' · 已收藏':''}${state.adopted.has(i)?' · 已行动':''} ${state.ignored.has(i)?' · 已忽略':''}</div></button>`}
function home(){return `<div class="pad">${statusNotice()}${state.mode==='empty'?`${homeThoughtHeading()}${empty('你的思想，会在这里慢慢清晰','从日记中整理你看重的事和做事准则。没有足够依据时，不替你下结论。','<button class="link" data-act="diary">写下今天的想法 →</button>')}`:`<div class="thought-hero">${homeThoughtHeading()}<button data-go="thoughts" style="text-align:left"><h2>把注意力留给<br>真正重要的事。</h2></button><div class="thought-sub">先做小规模验证，再投入更多。</div><div class="thought-sub">为长期自主性留出空间。</div><div class="meta">根据 12 篇演示日记整理 · 9 月 19 日更新</div></div>`}<section class="section">${homeSectionHeading('接下来','reminders')}${state.mode==='empty'?empty('近期没有提醒','把需要记住的事交给这里。','<button class="link" data-act="new-reminder">添加提醒 →</button>'):reminders().slice(0,2).map(reminderRow).join('')}</section><section class="section">${homeSectionHeading('对我有用','opportunities')}${state.mode==='empty'?empty('让读过的新闻，多留下一点价值','设置你最近的关注点，再从已读新闻中分析与你有关的变化。','<button class="link" data-act="focus">设置我的关注点 →</button>'):opportunities.map((o,i)=>!state.ignored.has(i)&&!state.adopted.has(i)?opportunityCard(o,i):'').join('')||empty('这一批有用点都处理过了','收藏和已行动的内容仍在「全部」中。')}</section></div>`}
function homeThoughtHeading(){return `<div class="thought-heading"><button class="heading-link" data-go="thoughts">我的思想${icon('arrow')}</button><button class="icon" data-chat="" aria-label="和自己聊聊" title="和自己聊聊">${icon('spark')}</button><button class="icon" data-go="settings" aria-label="设置与管理" title="设置与管理">${icon('settings')}</button></div>`}
function homeSectionHeading(text,page){return `<div class="section-title"><h3>${text}</h3><button class="icon" data-go="${page}" aria-label="查看全部${text}">${icon('arrow')}</button></div>`}
function homeDock(){return `<div class="dock"><nav class="tabs" aria-label="主导航">${[['globe','今日'],['diary','日记'],['book','读书'],['user','我的']].map(([i,t],n)=>`<button class="${n===3?'active':''}" ${n===3?'aria-current="page" data-go="home"':'data-act="existing-tab"'} data-label="${t}">${icon(i)}<span>${t}</span></button>`).join('')}</nav></div>`}
function thoughts(){if(state.mode==='empty')return `<div class="pad">${empty('先写下自己的想法','思想总结会从真实日记提取观点，并保留依据。','<button class="primary" data-act="diary">去写日记</button>')}</div>`;return `<div class="pad">${statusNotice()}<div class="kicker">我的个人思想总结</div><h1 class="reading-title">我想把日子过得<br>更有选择。</h1><p class="lead">以下是从日记里逐渐清晰的三条主线。它们可以变化，也可以由你来更正。</p>${[['01','把注意力留给真正重要的事','减少低价值的忙碌，把精力投入能持续积累的事情。'],['02','先做小规模验证，再投入更多','允许自己用一小步换取真实反馈，而不是在准备中消耗热情。'],['03','为长期自主性留出空间','选择工具和安排生活时，也考虑长期的掌控感。']].map(([n,t,p])=>`<div class="reading-block"><div class="kicker">核心观点 ${n}</div><h3>${t}</h3><p>${p}</p></div>`).join('')}<div class="reading-block"><span class="label">我看重什么</span><h3>专注，也是一种取舍。</h3><p>比起把每一件事都安排满，更希望知道，今天做的事情是否值得长期坚持。</p><details><summary>查看 3 条日记依据</summary><blockquote>“今天留出一段完整的时间，只做了最重要的一件事，反而轻松很多。”<small>演示日记 · 9 月 18 日</small></blockquote><blockquote>“有些事可以晚一点做，自己的节奏不能总被打断。”<small>演示日记 · 9 月 12 日</small></blockquote><blockquote>“不再为了填满时间而给自己安排任务。”<small>演示日记 · 9 月 8 日</small></blockquote></details><button class="link" data-chat="观点：把注意力留给真正重要的事">聊聊这个观点 ${icon('arrow')}</button></div>${[['做事准则','用一次小实验，替代长时间犹豫。'],['思考方式','先弄清问题，再选择工具。'],['变化与探索','从做得更多，慢慢转向做得更合适。']].map(([a,b])=>`<div class="reading-block"><span class="label">${a}</span><h3>${b}</h3><button class="link" data-chat="观点：${b}">沿着这个想法聊聊 ${icon('arrow')}</button></div>`).join('')}<details><summary>更正与使用偏好</summary><p>保留现有「在 AI 对话中使用我的思想」设置。原型不改变任何授权。</p><button class="link" data-act="correction">写下我的更正 →</button></details><p class="meta">全部为演示观点与依据，不是对你的实际总结。</p></div>`}
function reminders(){return (state.mode==='empty'?[]:baseReminders).concat(state.reminders).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function reminderList(){const list=reminders();return `<div class="pad"><p class="lead">记住重要的事，也留出自己的节奏。</p><div class="section-title"><span class="kicker">即将到来</span><span class="muted">${list.length} 项</span></div>${list.map(reminderRow).join('')||empty('还没有提醒','可以手动添加，也可以把有用的机会点转成提醒。','<button class="primary" data-act="new-reminder">添加提醒</button>')}<div class="notice" style="margin-top:var(--s5)">这里沿用现有提醒功能。每年、每月等重复周期会完整保留。</div></div>`}
function opportunityList(){const labels={pending:'待看',saved:'已收藏',adopted:'已行动',ignored:'已忽略'};const list=opportunities.map((o,i)=>({o,i})).filter(({i})=>state.filter==='pending'?!state.ignored.has(i)&&!state.adopted.has(i):state[state.filter].has(i));return `<div class="pad"><h1 class="reading-title">读过，然后有所收获。</h1><p class="lead">从读过的新闻中，找到值得尝试的事。</p><button class="link" data-act="focus">我的关注点：${escapeHtml(state.focus||'效率工具、长期自主')} ${icon('arrow')}</button>${statusNotice()}<div class="filters" aria-label="机会点筛选">${Object.entries(labels).map(([v,t])=>`<button class="${state.filter===v?'active':''}" aria-pressed="${state.filter===v}" data-filter="${v}">${t}</button>`).join('')}</div>${state.mode==='empty'?empty('还没有可以分析的已读新闻','先设置关注点，并读完一篇有正文的新闻。','<button class="link" data-act="focus">设置关注点 →</button>'):list.map(({o,i})=>opportunityCard(o,i)).join('')||empty('这里暂时没有内容','你收藏、采取行动或忽略的分析，会出现在对应分类。')}<p class="meta">只分析已读内容；没有明显关联时不强行推荐。</p></div>`}
function opportunityDetail(){const o=opportunities[state.selected];return `<article class="pad"><span class="tag blue">${o.type}</span><h1 class="reading-title">${o.title}</h1><p class="lead">${o.why}</p><div class="actions"><button class="link" data-act="save-opportunity">${icon('bookmark')}${state.saved.has(state.selected)?'已收藏':'收藏'}</button><button class="link" data-act="ignore">${state.ignored.has(state.selected)?'恢复到待看':'与我无关'}</button></div><section class="reading-block"><div class="label">01 · 新闻说了什么</div><h3>${o.news}</h3><p>${o.fact}</p><details><summary>查看新闻依据 · ${o.source}</summary><blockquote>${o.fact}<small>虚构示例文章 · 9 月 20 日发布 / 已读</small></blockquote><p>正式版本此处可打开对应原文；原型无真实新闻链接。</p></details></section><section class="reading-block"><div class="label">02 · 为什么与我有关 <span class="tag">关联推断</span></div><h3>从我的关注点出发</h3><p class="why">${o.relation}</p><button class="link" data-go="thoughts">查看相关思想依据 ${icon('arrow')}</button></section><section class="reading-block"><div class="label">03 · 可以先做什么</div><h3>先花一点时间，得到真实反馈。</h3><p>${o.action}</p></section><section class="reading-block"><div class="label">04 · 还要确认什么</div><p class="muted">${o.risk}</p></section><p class="meta">示例分析 · AI 建议需由你判断后再行动</p></article>`}
function chat(){return `<div class="pad">${state.context?`<div class="chat-context"><span><small>本轮参考 · 发送前可移除</small><br>${escapeHtml(state.context)}</span><button data-act="remove-context" aria-label="移除本轮上下文">${icon('close')}</button></div>`:'<div class="meta">本轮未附带个人资料 · 正式版遵守你的使用偏好</div>'}${state.messages.length?state.messages.map(m=>`<div class="bubble ${m.role}">${m.role==='ai'?'<small>AI 协助 · 演示回复</small>':''}${escapeHtml(m.text)}</div>`).join(''):`<div class="chat-greeting">${icon('spark')}<h2>有些想法，<br>聊一聊就更清楚了。</h2><p>${state.context?'围绕这条内容继续想一想，不必重新交代背景。':'从最近的困惑、想做的事，或者一个没想明白的问题开始。'}</p></div>${['这件事为什么值得我花时间？','帮我找到一个最小的下一步','我有哪些假设还没有确认？'].map(q=>`<button class="suggestion" data-prompt="${q}">${q} →</button>`).join('')}`}<p class="meta" style="margin-top:var(--s5)">原型不连接 AI。对话不会写入日记或建立真实提醒。</p></div>`}
function settings(){return `<div class="pad"><p class="lead">个人内容与应用管理，集中放在这里。</p>${[['bookmark','收藏与外部收藏'],['clock','同步与任务'],['settings','应用设置'],['user','数据与隐私']].map(([i,t])=>`<button class="menu-row" data-existing="${t}">${icon(i)}<span>${t}</span>${chevron()}</button>`).join('')}<button class="menu-row" data-act="focus">${icon('spark')}<span>新闻分析关注点</span>${chevron()}</button><p class="meta">原来的管理入口完整保留，避免与个人提醒混淆。</p></div>`}
const noteData={home:['个人概览',['先看到自己','思想主线直接可读，不用先进入功能宫格。'],['再看到下一步','近期提醒与阅读机会各露出两条，避免首页无限延长。'],['对话随手可达','聊天和设置合并在思想标题行，不再独占顶部一行。']],thoughts:['思想有重点，也有依据',['三条主线','首屏突出核心观点，下方按主题阅读。'],['原文按需展开','保留引用与更正入口，不把零散摘录铺满页面。']],reminders:['从想法到行动',['共享同一套提醒','年度周期保留；编辑沿用刚完成的新面板。'],['确认后再保存','分析可以起草任务，但不会自动创建通知。']],opportunities:['阅读与自己的连接',['不是另一个新闻列表','每条标题写价值，摘要解释与你的关系。'],['反馈帮助筛选','收藏、已行动和与我无关，让有用内容沉淀下来。']],opportunity:['事实、关联、行动',['四层信息','原文事实 → 关联推断 → 一步行动 → 待确认条件。'],['有依据才下结论','不给虚构匹配分数，不把所有新闻都说成商业机会。']],chat:['AI 是思考的入口',['上下文透明','从哪里进入，就带上哪条内容，发送前可移除。'],['继续现有能力','保留历史与工具能力，任务和观点更正都经确认。']],settings:['管理收在后面',['首页专注个人内容','收藏、后台任务、设置、隐私仍然可达。']]};
function render(){const p=state.page;$('#toolbar').innerHTML=p==='home'?'':title(({thoughts:'我的思想',reminders:'提醒任务',opportunities:'对我有用',opportunity:'阅读机会点',chat:'和自己聊聊',settings:'设置与管理'})[p],p==='reminders'?`<button class="icon" data-act="new-reminder" aria-label="添加提醒">${icon('plus')}</button>`:p==='chat'?'<button class="link" data-act="history">历史</button>':p==='opportunities'?`<button class="link" data-act="analyze" ${state.mode==='loading'?'disabled':''}>分析新阅读</button>`:'');$('#content').innerHTML=({home,thoughts,reminders:reminderList,opportunities:opportunityList,opportunity:opportunityDetail,chat,settings})[p]();$('#bottom').innerHTML=p==='home'?homeDock():p==='opportunity'?`<div class="footer-actions"><button class="secondary" data-chat="${opportunities[state.selected].context}">聊聊这个</button><button class="primary" data-act="convert">${state.adopted.has(state.selected)?'查看提醒':'转成提醒'}</button></div>`:p==='chat'?`<form class="composer" id="chat-form"><label for="message" class="sr-only">输入想聊的内容</label><textarea id="message" placeholder="把想法说出来…" rows="1" maxlength="2000" required></textarea><button aria-label="发送">${icon('send')}</button></form>`:'';$('#steps').innerHTML=[['home','我的概览'],['thoughts','个人思想'],['reminders','提醒任务'],['opportunities','新闻机会点'],['chat','和自己聊聊']].map(([v,t],i)=>`<button class="${p===v||p==='opportunity'&&v==='opportunities'?'active':''}" data-preview="${v}"><b>0${i+1}</b>${t}</button>`).join('');const n=noteData[p];$('#note-title').textContent=n[0];$('#notes').innerHTML=n.slice(1).map(([a,b])=>`<div class="note"><strong>${a}</strong><p>${b}</p></div>`).join('');$('#state-control').value=state.mode;$('#mobile-state').value=state.mode}
let activeReminder=null,returnFocus=null;
function openSheet(html){returnFocus=document.activeElement;$('#overlay').innerHTML=`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-heading" tabindex="-1"><div class="handle"></div>${html}</section></div>`;$('#overlay .sheet').focus()}
function closeSheet(){$('#overlay').innerHTML='';returnFocus?.focus()}
function reminderSheet(r=null,op=null){activeReminder=r;openSheet(`<div class="sheet-title"><h2 id="sheet-heading">${r?'编辑提醒':'添加提醒'}</h2><button class="icon" data-act="close-sheet" aria-label="关闭">${icon('close')}</button></div><div class="sheet-body"><form id="reminder-form"><label class="field">提醒内容<textarea name="title" required maxlength="200">${escapeHtml(r?.title||(op!==null?opportunities[op].kind:''))}</textarea></label>${op!==null?'<p class="meta">来自阅读机会点 · 保存后标记为已行动</p>':''}<label class="field">重复周期<select name="repeat">${['不重复','每天','每周','每月','每年'].map(x=>`<option ${x===(r?.repeat||'不重复')?'selected':''}>${x}</option>`).join('')}</select></label><label class="field-row">开始日期<input aria-label="开始日期" name="date" type="date" required value="${r?.date||'2026-09-21'}"></label><label class="field-row">结束日期<input aria-label="结束日期" name="end" type="date" value="${r?.end||''}"></label><p class="meta">结束日期留空表示不设结束日期。</p><label class="field-row">提醒时间<input aria-label="提醒时间" name="time" type="time" required value="${r?.time||'09:00'}"></label><details><summary>高级规则</summary><p>正式版本沿用现有提醒配置与特殊日期规则。</p></details><p class="meta">仅保存到当前预览，不会发送通知。</p><input type="hidden" name="op" value="${op??''}"></form></div><div class="footer-actions"><button class="secondary" data-act="close-sheet">取消</button><button class="primary" type="submit" form="reminder-form">保存</button></div>`)}
function textSheet(type){const focus=type==='focus';openSheet(`<div class="sheet-title"><h2 id="sheet-heading">${focus?'我的关注点':'更正我的思想'}</h2><button class="icon" data-act="close-sheet" aria-label="关闭">${icon('close')}</button></div><div class="sheet-body"><p class="muted">${focus?'哪些事情，是你最近真正关心的？新闻分析将以这些关注点为依据。':'写下你认可的表述。正式版本会保留更正，重新整理时优先参考。'}</p><form id="text-form"><label class="field">${focus?'关注点':'我的表述'}<textarea name="text" required maxlength="500">${escapeHtml(focus?state.focus||'效率工具、长期自主':'')}</textarea></label><input name="type" type="hidden" value="${type}"></form><p class="meta">演示保存，不修改真实数据或授权。</p></div><div class="footer-actions"><button class="secondary" data-act="close-sheet">取消</button><button class="primary" form="text-form">保存</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){b.dataset.go==='home'?selectPage('home'):go(b.dataset.go);return}if(b.dataset.preview){selectPage(b.dataset.preview);return}if(b.hasAttribute('data-chat')){state.context=b.dataset.chat;state.messages=[];go('chat');return}if(b.dataset.opportunity!==undefined){state.selected=Number(b.dataset.opportunity);go('opportunity');return}if(b.dataset.reminder!==undefined){reminderSheet(reminders()[Number(b.dataset.reminder)]);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.prompt){$('#message').value=b.dataset.prompt;$('#message').focus();return}if(b.dataset.existing){toast(`${b.dataset.existing}将沿用现有页面，本原型不展开。`);return}switch(b.dataset.act){case'back':back();break;case'close-sheet':closeSheet();break;case'new-reminder':reminderSheet();break;case'retry':case'analyze':if(state.mode==='empty'){toast('先有已读新闻，再进行分析。');break}state.mode='loading';render();toast('演示更新中状态；可在顶部切换其他状态。');break;case'focus':textSheet('focus');break;case'correction':textSheet('correction');break;case'save-opportunity':state.saved.has(state.selected)?state.saved.delete(state.selected):state.saved.add(state.selected);{const y=$('#content').scrollTop;render();$('#content').scrollTop=y}toast(state.saved.has(state.selected)?'已收藏到「对我有用」':'已取消收藏');break;case'ignore':{const i=state.selected;if(state.ignored.has(i)){state.ignored.delete(i);toast('已恢复到待看')}else{state.ignored.add(i);toast('已移至「已忽略」，可随时恢复')}render();break}case'convert':{const existing=state.reminders.find(r=>r.op===state.selected);reminderSheet(existing||null,state.selected);break}case'remove-context':state.context='';render();break;case'history':openSheet('<div class="sheet-title"><h2 id="sheet-heading">最近的对话</h2><button class="icon" data-act="close-sheet" aria-label="关闭">'+icon('close')+'</button></div><div class="sheet-body"><p>正式版本保留现有聊天记录。</p><p class="meta">原型未载入你的私人对话。</p><button class="link" data-act="close-sheet">返回当前对话 →</button></div>');break;case'existing-tab':toast(`「${b.dataset.label}」保留现有页面，本次预览聚焦「我的」。`);break;case'diary':toast('正式版本将打开日记；原型不读取或写入私人日记。');break}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chat-form'){const message=$('#message').value.trim();if(!message)return;state.messages.push({role:'user',text:message},{role:'ai',text:state.context?'先围绕这条内容梳理：你希望它帮你解决什么具体问题？可以先确定一个小实验，再约定判断是否值得继续的标准。':'我们可以先挑一件最近让你反复想起的事：你在意的结果是什么，最不确定的又是什么？把这两点分开，下一步往往会更清楚。'});render();$('#content').scrollTop=$('#content').scrollHeight;return}if(e.target.id==='reminder-form'){const f=new FormData(e.target);if(f.get('end')&&f.get('end')<f.get('date')){toast('结束日期不能早于开始日期');return}const r={title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),end:f.get('end'),repeat:f.get('repeat')};if(!r.title){toast('请输入提醒内容');return}const op=f.get('op');if(op!==''){r.op=Number(op);state.adopted.add(r.op)}if(activeReminder)Object.assign(activeReminder,r);else state.reminders.push(r);closeSheet();render();toast('已保存演示提醒，未安排真实通知');return}if(e.target.id==='text-form'){const f=new FormData(e.target);const text=f.get('text').trim();if(!text){toast('请先填写内容');return}if(f.get('type')==='focus')state.focus=text;closeSheet();render();toast('已保存演示内容')}});
document.addEventListener('keydown',e=>{const dialog=$('#overlay .sheet');if(e.key==='Escape'&&dialog){closeSheet();return}if(e.key==='Tab'&&dialog){const nodes=[...dialog.querySelectorAll('button,input,textarea,select,summary')].filter(x=>x.getClientRects().length&&!x.disabled);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#theme').onclick=()=>{document.body.classList.toggle('light');$('#theme').textContent=document.body.classList.contains('light')?'深色':'浅色'};
for(const id of ['#state-control','#mobile-state'])$(id).onchange=e=>{state.mode=e.target.value;selectPage('home')};
const originalRender=render;render=function(){originalRender();$('#content').classList.toggle('home-view',state.page==='home');$('#toolbar').classList.toggle('home-toolbar',state.page==='home')};
$('#battery').innerHTML=icon('battery');render();
</script>
</body>
</html>
