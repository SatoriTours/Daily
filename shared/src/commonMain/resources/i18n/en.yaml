diagnostics:
  title: Diagnostics and logs
  subtitle: Export recent logs and the last crash
  description: Records safe request metadata, business operations and errors. Export one AI-readable text file for the 30 minutes before you tap export.
  privacy: Credentials, diary entries, conversations and full bodies are excluded. Unknown free text is omitted. Logs stay local and are never uploaded automatically.
  coverage: WebView and system downloads expose limited lifecycle events. Forced termination or low memory may lose the tail. The report explains coverage and gaps.
