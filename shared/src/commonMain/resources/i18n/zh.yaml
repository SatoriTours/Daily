diagnostics:
  title: 诊断与日志
  subtitle: 导出最近半小时日志与崩溃现场
  description: 持续记录脱敏的请求、业务过程和异常。导出窗口固定为点击时刻之前的 30 分钟，保存为一个 AI 可读的文本文件。
  privacy: 不记录凭据、日记、对话或完整正文；未知自由文本会省略。日志只保存在本机，不会自动上传。
  coverage: WebView 和系统下载仅记录可观测事件；强杀或内存不足可能丢失末尾记录。具体覆盖范围和缺口会写入报告。
